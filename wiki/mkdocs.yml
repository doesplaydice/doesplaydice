site_name: Does Play Dice
site_description: A storytelling game that's free to download, quick to learn, and only limited by your imagination.
site_url: https://doesplaydice.com/

# Drives the "Edit this page" pencil.
repo_url: https://github.com/doesplaydice/doesplaydice
repo_name: doesplaydice/doesplaydice
edit_uri: edit/main/wiki/docs/

theme:
  name: material
  language: en
  # TEMPORARY: pre-launch gate. Remove custom_dir and wiki/overrides/ at go-live.
  custom_dir: overrides
  # Fonts are self-hosted -- see assets/stylesheets/fonts.css.
  # `false` stops Material requesting anything from Google.
  font: false
  icon:
    logo: material/dice-d20
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    # Dark first and no media query, so dark is the default with no stored
    # preference. The design is dark-first by intent.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/moon-waning-crescent
        name: Switch to light
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: Switch to terminal
    # A third state, and not a joke at the expense of the design: the game's
    # whole premise is a rules system you can hold in your head, and Jeff's
    # motivation is the 2023 OGL revocation. A phosphor CRT is the right kind
    # of nerd. Material takes an arbitrary scheme name here and simply sets
    # data-md-color-scheme, so the styling is ours.
    - scheme: terminal
      primary: custom
      accent: custom
      toggle:
        icon: material/television-classic
        name: Switch to dark
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.tooltips

extra_css:
  - assets/stylesheets/fonts.css
  - assets/stylesheets/extra.v7.css
extra_javascript:
  # The try-it roller on the rules page.
  - assets/js/dice.js
  # Registers the service worker. Kept out of the template so it survives the
  # pre-launch teardown -- offline support is permanent, the gate is not.
  - assets/js/offline.js
  # The quick roller on the Narrator's screen.
  - assets/js/screen.js
  # Writes the filled-in character sheet to a PDF in the browser. Loaded first
  # so sheet.js can tell whether the Download button has anything behind it.
  - assets/js/sheet-pdf.js
  # Makes the character sheet typeable in the browser.
  - assets/js/sheet.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      # Material renders this as the right sidebar's heading.
      # "On this page" contrasts with the section name on the left.
      title: On this page
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# The fonts README is for people reading the repo, not a page on the site.
# CNAME must reach the built site, so it is NOT excluded -- GitHub Pages reads
# it from the deployed artifact, and without it a deploy clears the custom domain.
exclude_docs: |
  assets/fonts/README.md

plugins:
  - search

extra:
  # The "Made with Material for MkDocs" line moves to the license page, where
  # the rest of the credits live. Material is MIT; the footer notice is a
  # courtesy, not a condition, and the footer had grown too long to read.
  generator: false
  social:
    - icon: material/web
      link: https://doesplaydice.com
      name: doesplaydice.com

# Two short lines rather than one long one. The excluded-marks wording that used
# to live here is the sort of thing you read once, so it moved to /license/.
copyright: >
  <span class="dpd-colophon">
  <span>Does Play Dice &middot; 2026 &middot;
  <a href="/license/" rel="license">CC BY 4.0</a></span>
  <span class="dpd-colophon-by">Made with
  <span class="dpd-heart" role="img" aria-label="love">&#9829;</span>
  by <a href="https://llamassist.ai">Llamassist</a></span>
  </span>

nav:
  - Home: index.md
  - Player's Guide:
      - Character Vitae: rules/character-vitae.md
      - Basic Rules: rules/index.md
      - "Example of play": rules/at-the-table.md
      - The odds: rules/odds.md
      - Taking turns: rules/taking-actions.md
      - "Combat, harm and recovery": rules/combat.md
      - "Skills and training": rules/training.md
  - Narrator's Guide:
      - Running a game: narrators/index.md
      - The screen: narrators/screen.md
  - Contributor's Guide:
      - How to contribute: contribute/index.md
      - Make it yours: license.md
  - Downloads: downloads.md
