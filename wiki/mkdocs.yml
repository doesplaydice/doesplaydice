# ---------------------------------------------------------------------------
# PROTOTYPE — built for the Jeff Adams strategy call.
# Everything marked "OPEN DECISION" in the content is deliberately unresolved.
# ---------------------------------------------------------------------------

site_name: Does Play Dice
site_description: A story-telling game that's free to download, quick to learn, and only limited by your imagination.
site_url: https://doesplaydice.com/

# PLACEHOLDER — repo does not exist yet. Drives the "Edit this page" pencil,
# which is the whole "Jeff can update it himself" story.
repo_url: https://github.com/doesplaydice/doesplaydice
repo_name: doesplaydice/doesplaydice
edit_uri: edit/main/wiki/docs/

theme:
  name: material
  language: en
  # Fonts are self-hosted -- see assets/stylesheets/fonts.css.
  # `false` stops Material requesting anything from Google.
  font: false
  icon:
    logo: material/dice-d20
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.tooltips

extra_css:
  - assets/stylesheets/fonts.css
  - assets/stylesheets/extra.v2.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# The fonts README is for people reading the repo, not a page on the site.
exclude_docs: |
  assets/fonts/README.md

plugins:
  - search

extra:
  social:
    - icon: material/web
      link: https://doesplaydice.com
      name: doesplaydice.com

copyright: >
  Does Play Dice by Jeff Adams &middot; text licensed
  <a href="https://creativecommons.org/licenses/by/4.0/" rel="license">CC BY 4.0</a>
  &middot; the name and logo are excluded

nav:
  - Home: index.md
  - The Rules:
      - Basic Rules (complete): rules/index.md
      - Character Vitae: rules/character-vitae.md
      - Expanded Rules: rules/expanded.md
  - The World:
      - About the setting: world/index.md
  - For Narrators:
      - Running a game: narrators/index.md
  - Launch plan:
      - Overview: plan/index.md
      - Week by week: plan/weeks.md
      - How to run a playtest: plan/playtesting.md
      - The five tests: plan/tests.md
      - Is the test any good?: plan/validity.md
      - Progress log: plan/progress.md
  - Community:
      - Modules: community/index.md
      - "Sample: The Long Way Round": community/modules/sample-module.md
  - Contribute:
      - How to contribute: contribute/index.md
  - Download: downloads.md
