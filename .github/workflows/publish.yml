# The publishing machine.
#
# This is what makes "click the pencil, it's live in a minute" true. Without it
# the CMS is just a nice text box.

name: Publish site

on:
  # tools/** and requirements.txt are in here because the build RUNS them.
  # Without that, a change breaking build_pdf.py or check-links.py would sit
  # undetected until somebody happened to edit a page under wiki/.
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/publish.yml"
  pull_request:
    paths:
      - "wiki/**"
      - "tools/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Every PR gets built. A contributor finds out their edit breaks the site
  # before a reviewer has to notice it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Build (strict -- broken markdown links fail the build)
        run: mkdocs build --strict --config-file wiki/mkdocs.yml
      # The printable PDFs are generated from the built site rather than
      # committed, so they can never drift from what the pages actually say.
      # ubuntu-latest ships Google Chrome preinstalled; the script finds it.
      # This runs BEFORE the link check because the Download page links to
      # the files it produces.
      - name: Build the PDFs
        run: python3 tools/build_pdf.py --site wiki/site
      # --strict only validates links MkDocs resolves itself, which means
      # markdown links and nothing else. Several pages are hand-written HTML
      # blocks, and every href in those is invisible to it -- that is how the
      # download links shipped pointing at /downloads/downloads/*.pdf. This
      # checks the built HTML, so raw hrefs are covered too.
      - name: Check internal links
        run: python3 tools/check-links.py wiki/site
      - name: Upload
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: wiki/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
